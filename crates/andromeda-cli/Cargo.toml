[package]
name = "andromeda-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "andromeda: run the switch, manage the fabric, and drive benchmarks"

[[bin]]
name = "andromeda"
path = "src/main.rs"

[dependencies]
andromeda-core = { workspace = true }
andromeda-nat = { workspace = true }
andromeda-control = { workspace = true }
andromeda-dataplane = { workspace = true }

[features]
default = []
# Turns on the `run` subcommand (real AF_XDP datapath, Linux + libxdp only).
afxdp = ["andromeda-dataplane/afxdp"]
