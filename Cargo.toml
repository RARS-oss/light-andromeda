[workspace]
resolver = "2"
members = [
    "crates/andromeda-core",
    "crates/andromeda-nat",
    "crates/andromeda-control",
    "crates/andromeda-dataplane",
    "crates/andromeda-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/your-handle/light-andromeda"
description = "Light-Andromeda: a user-space, kernel-bypass network virtualization dataplane (VPC overlay + NAT) in the spirit of Google Andromeda"

[workspace.dependencies]
andromeda-core = { path = "crates/andromeda-core" }
andromeda-nat = { path = "crates/andromeda-nat" }
andromeda-control = { path = "crates/andromeda-control" }
andromeda-dataplane = { path = "crates/andromeda-dataplane" }
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
