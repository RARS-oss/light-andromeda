<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 430" width="1060" height="430" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#5f7f9c"/>
    </marker>
    <marker id="art" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#2bc4b2"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="1058" height="428" rx="16" fill="#0f1b1e" stroke="#24363b" stroke-width="1.5"/>

  <text x="30" y="34" fill="#eaf3f2" font-size="18" font-weight="700">A ping travels through the overlay across two user-space switches</text>

  <!-- control plane -->
  <rect x="330" y="58" width="400" height="60" rx="10" fill="#181426" stroke="#3a3358" stroke-width="1.2"/>
  <text x="530" y="82" fill="#c9c2ec" font-size="13" font-weight="700" text-anchor="middle">control plane · Fabric</text>
  <text x="530" y="102" fill="#8f88b4" font-size="11.5" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">(VNI, inner-IP) → underlay node + MAC · from TOML</text>
  <line x1="420" y1="118" x2="360" y2="196" stroke="#3a3358" stroke-width="1.2" stroke-dasharray="4 4"/>
  <line x1="640" y1="118" x2="700" y2="196" stroke="#3a3358" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text x="512" y="140" fill="#6f6893" font-size="10.5" text-anchor="middle">programs both switches</text>

  <!-- Tenant A -->
  <rect x="28" y="210" width="150" height="96" rx="10" fill="#16242a" stroke="#2b3d42"/>
  <text x="103" y="238" fill="#dbe7e7" font-size="14" font-weight="700" text-anchor="middle">Tenant A</text>
  <text x="103" y="260" fill="#8ba0a7" font-size="12" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">10.0.0.10</text>
  <text x="103" y="286" fill="#64777d" font-size="10.5" text-anchor="middle">netns · raw Eth frame</text>

  <!-- Switch 1 -->
  <rect x="238" y="196" width="196" height="124" rx="10" fill="#0e2723" stroke="#2bc4b2" stroke-width="1.4"/>
  <text x="336" y="222" fill="#63e0cf" font-size="14" font-weight="700" text-anchor="middle">Switch 1</text>
  <text x="336" y="244" fill="#a7bdc0" font-size="11.5" text-anchor="middle">parse → resolve → NAT</text>
  <text x="336" y="262" fill="#63e0cf" font-size="12.5" font-weight="700" text-anchor="middle">→ ENCAP</text>
  <text x="336" y="292" fill="#64777d" font-size="10.5" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">AF_XDP · user space</text>
  <text x="336" y="308" fill="#64777d" font-size="10.5" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">node 192.168.1.1</text>

  <!-- underlay overlay packet (between the two switches) -->
  <g text-anchor="middle" font-size="9" font-weight="600">
    <rect x="442" y="238" width="28" height="40" rx="4" fill="#5f7f9c"/>
    <rect x="472" y="238" width="30" height="40" rx="4" fill="#c69141"/>
    <rect x="504" y="238" width="18" height="40" rx="4" fill="#c96f7c"/>
    <rect x="524" y="238" width="24" height="40" rx="4" fill="#2bc4b2"/>
    <rect x="550" y="238" width="68" height="40" rx="4" fill="#7b7fd0"/>
    <text x="530" y="228" fill="#8ba0a7" font-size="10.5" font-weight="600">Andromeda overlay · VNI 100</text>
    <text x="584" y="262" fill="#f2f2ff" font-size="9">inner</text>
  </g>

  <!-- Switch 2 -->
  <rect x="626" y="196" width="196" height="124" rx="10" fill="#0e2723" stroke="#2bc4b2" stroke-width="1.4"/>
  <text x="724" y="222" fill="#63e0cf" font-size="14" font-weight="700" text-anchor="middle">Switch 2</text>
  <text x="724" y="244" fill="#63e0cf" font-size="12.5" font-weight="700" text-anchor="middle">DECAP →</text>
  <text x="724" y="262" fill="#a7bdc0" font-size="11.5" text-anchor="middle">deliver to tenant</text>
  <text x="724" y="292" fill="#64777d" font-size="10.5" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">AF_XDP · user space</text>
  <text x="724" y="308" fill="#64777d" font-size="10.5" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">node 192.168.1.2</text>

  <!-- Tenant B -->
  <rect x="882" y="210" width="150" height="96" rx="10" fill="#16242a" stroke="#2b3d42"/>
  <text x="957" y="238" fill="#dbe7e7" font-size="14" font-weight="700" text-anchor="middle">Tenant B</text>
  <text x="957" y="260" fill="#8ba0a7" font-size="12" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">10.0.0.20</text>
  <text x="957" y="286" fill="#64777d" font-size="10.5" text-anchor="middle">netns · raw Eth frame</text>

  <!-- arrows (left-to-right flow) -->
  <line x1="178" y1="258" x2="233" y2="258" stroke="#5f7f9c" stroke-width="2" marker-end="url(#ar)"/>
  <text x="206" y="248" fill="#64777d" font-size="10" text-anchor="middle">veth</text>
  <line x1="434" y1="258" x2="440" y2="258" stroke="#2bc4b2" stroke-width="2"/>
  <line x1="618" y1="258" x2="625" y2="258" stroke="#2bc4b2" stroke-width="2" marker-end="url(#art)"/>
  <line x1="822" y1="258" x2="877" y2="258" stroke="#5f7f9c" stroke-width="2" marker-end="url(#ar)"/>
  <text x="850" y="248" fill="#64777d" font-size="10" text-anchor="middle">veth</text>

  <!-- bypass caption -->
  <rect x="28" y="352" width="1004" height="52" rx="10" fill="#0d1719" stroke="#22343a"/>
  <text x="48" y="376" fill="#63e0cf" font-size="12.5" font-weight="700" font-family="ui-monospace, Menlo, monospace">AF_XDP kernel bypass</text>
  <text x="48" y="393" fill="#8ba0a7" font-size="11.5">frames are lifted from the driver hook straight into a user-space ring (UMEM) — no sk_buff, no kernel network-stack traversal. Proxy-ARP, so no static neighbours.</text>
</svg>
